# !reset снимает локальную публикацию портов.

services:
  postgres:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  backend:
    image: accountthis-backend:latest
    ports: !reset []

  worker:
    image: accountthis-worker:latest

  nginx:
    image: accountthis-nginx:latest
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: accountthis-caddy
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
