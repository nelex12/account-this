openapi: 3.0.3
info:
  title: API Системы учета и выдачи инструментов
  description: |
    Спецификация REST API для синхронизации, авторизации и управления реестром оборудования с проверкой Ed25519 подписей оффлайн.
    Подробная логика — в документе «Описание проекта подробно, используемое в разработке».

    ## Время
    Все метки времени в API и в протоколе QR — Unix time в секундах (UTC, int64); от часового пояса не зависят.
    Клиенты работают по времени сервера: `serverTime` из `/api/auth/server-key` и `/api/auth/worker-cert`
    задаёт смещение локальных часов.

    ## Авторизация
    Сессия — пара токенов, оба выдаёт `POST /api/auth/login`:
    - **access token** — JWT в заголовке `Authorization: Bearer <accessToken>`, срок действия 15 минут.
      Содержит id пользователя (claim `sub`), роль (claim `role`) и id его компании (claim `company_id`);
      подписан HMAC-SHA256 (секрет `JWT_SIGNING_KEY`). Не отзывается: действует до истечения срока.
    - **refresh token** — случайные 32 байта (base64url без паддинга, 43 символа) в cookie `refresh_token`
      с атрибутами `HttpOnly; Secure; SameSite=Strict; Path=/api/auth`. Срок действия — 30 дней с момента выдачи.
      JavaScript cookie не видит (XSS её не украдёт), браузер отправляет её только на `/api/auth/*`
      и только с того же сайта. Сервер хранит не сам токен, а его SHA-256.

    Access token истёк (401 от любого эндпоинта) — клиент вызывает `POST /api/auth/refresh` и получает новую пару.
    **Ротация:** предъявленный refresh token гасится, взамен выдаётся новый с новым сроком 30 дней. Повторное
    предъявление погашенного токена — признак кражи: гасится вся сессия (все токены цепочки), нужно войти заново.
    `POST /api/auth/logout` завершает сессию.

    **Отзыв при увольнении:** `DELETE /api/users/{id}` гасит все refresh token пользователя (все его сессии);
    выданный access token действует до истечения — не более 15 минут. Офлайн-сертификат сотрудника
    (`/api/auth/worker-cert`) проверяется без сервера и не отзывается, поэтому операции, совершённые после
    увольнения, при синхронизации получают флаг WORKER_DEACTIVATED.

    ## Идентификаторы
    id пользователей, компаний и инструментов — UUID в каноническом виде (строчные hex, `8-4-4-4-12`). Их нельзя
    перебрать и по ним нельзя оценить число пользователей или инструментов. Защитой данных они не являются:
    от доступа к чужому объекту защищает проверка компании (см. ниже), а не секретность id.
    Значение, не являющееся UUID, в пути или запросе — 400.
    id записей журнала (`logId`, `RentalLogEntry.id`) и уведомлений (`Notification.id`) — обычные числа.
    Перебор по ним ничего не даёт: записи всегда выбираются по компании, чужая неотличима от несуществующей (404).

    ## Компании
    У компании есть только название (не уникальное). Каждый пользователь (любой роли), инструмент и запись журнала
    принадлежит ровно одной компании, компания не меняется. Компании полностью изолированы друг от друга: Owner
    подтверждает и увольняет только пользователей своей компании, Issuer и Owner видят только инструменты и журнал
    своей компании, а в журнал не попадает ни сотрудник, ни инструмент, ни завхоз другой компании (это гарантируют
    и проверки сервера, и составные внешние ключи БД). Объект другой компании неотличим от несуществующего — 404
    (для `/api/sync` — флаги UNKNOWN_WORKER и UNKNOWN_TOOL).

    Все три роли регистрируются сами (`POST /api/auth/register`). Owner при регистрации создаёт новую компанию
    и подтверждается сразу (подтверждать некому). Списка компаний нет: Owner берёт id своей компании в
    `GET /api/companies/my` и сообщает сотрудникам и завхозам, они указывают его (`companyId`) при регистрации
    и ждут подтверждения Owner этой компании. Неугадываемый id позволяет присоединиться только тем, кому его сообщили.

    Сколько владельцев может быть у одной компании и можно ли присоединиться к существующей компании как владелец —
    не решено. Схема БД количество Owner в компании не ограничивает; сейчас регистрация Owner всегда создаёт новую компанию.

    ## Телефон
    Российский номер. На входе (регистрация, вход) допускаются префиксы `+7`, `7` или `8`, затем ровно 10 цифр;
    между ними — пробелы, скобки, дефисы: `+7 (999) 123-45-67`, `89991234567`. Сервер приводит номер к виду
    `+7XXXXXXXXXX` и дальше работает только с ним: хранение, проверка уникальности, вход, ответы API.
    Другой формат — 400.

    ## Уведомления
    Owner получает уведомления о том, что требует его внимания (`GET /api/notifications`): сотрудник ждёт
    подтверждения, возможна кража сессии, синхронизация с подозрительными записями. Их создаёт отдельный процесс
    (AccountThis.Worker) по событиям из RabbitMQ, поэтому уведомление появляется не в ответе на действие,
    а спустя мгновение после него (обычно меньше секунды). Клиенту достаточно запрашивать список периодически
    или при открытии экрана.

    ## Формат QR и подписей
    Ed25519 (RFC 8032); ключи и подписи — сырые байты в base64url без паддинга.
    Строка QR сотрудника: `AT1.<token>.<serverSignature>.<op>.<workerSignature>` (схема OfflineRentalPayload,
    там же правила строгого разбора).

    ## Ошибки
    - **400** — тело ValidationProblemDetails (`application/problem+json`). Ключи `errors` — путь к полю
      в именах JSON: `fullName`, `[3].qr` (элемент массива, нумерация с 0), `id`, `action` (параметры пути и запроса).
      Если тело не удалось разобрать как JSON нужной формы, ключ — JSON-путь (`$`, `$.role`, `$[3].scannedAt`)
      и ошибка про само тело (ключ — имя параметра метода, например `request` или `records`).
    - **401 / 403 от проверки JWT и роли** (до контроллера) — без тела; у 401 заголовок `WWW-Authenticate: Bearer`.
    - **401 / 403 / 404 / 409 от контроллера** (бизнес-проверки) — тело ProblemDetails (`application/problem+json`),
      `detail` — понятное пользователю пояснение на русском.
    - Во всех ProblemDetails есть `traceId` — идентификатор запроса для поиска в логах сервера.
  version: 5.1.0

servers:
  - url: http://localhost
    description: Через nginx (полный стек, start-all.bat)
  - url: http://localhost:5000
    description: Backend напрямую (Docker, порт BACKEND_PORT)

tags:
  - name: Auth
    description: Регистрация, вход, ключ сервера и сертификаты сотрудников
  - name: Companies
    description: Своя компания (id для регистрации сотрудников)
  - name: Users
    description: Управление пользователями своей компании (Owner)
  - name: Tools
    description: Реестр инструментов
  - name: Sync
    description: Синхронизация оффлайн-журнала завхоза и просмотр журнала операций
  - name: Notifications
    description: Уведомления Owner о событиях, требующих внимания

paths:

  # ==========================================
  # АВТОРИЗАЦИЯ И КЛЮЧИ
  # ==========================================
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: Register
      summary: Регистрация нового пользователя
      description: |
        Регистрируются все роли. Компания задаётся по роли:
        - **Owner** передаёт `companyName` — создаётся новая компания, а Owner становится её первым пользователем
          и подтверждается сразу (is_approved = true): подтверждать некому. `companyId` не передаётся.
        - **Worker** и **Issuer** передают `companyId` существующей компании (id сообщает её Owner, он виден в
          `GET /api/companies/my`); аккаунт создаётся с is_approved = false и ждёт подтверждения Owner этой компании.
          `companyName` не передаётся.

        Во всех случаях is_active = true. Телефон нормализуется к `+7XXXXXXXXXX` и уникален среди всех пользователей,
        включая уволенных: `89991234567` и `+7 (999) 123-45-67` — один и тот же номер. Без авторизации.

        Если регистрация не удалась (409), компания не создаётся.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
      responses:
        '201':
          description: |
            Аккаунт зарегистрирован (без тела). Owner может входить сразу; Worker и Issuer — после подтверждения Owner.
        '400':
          description: |
            Некорректный запрос (ValidationProblemDetails). Помимо обычных ошибок полей:
            - поля компании не соответствуют роли: у Owner нет `companyName` или передан `companyId`;
              у Worker и Issuer нет `companyId` или передан `companyName`;
            - `companyId` — компании с таким id нет.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                errors:
                  companyId: ['Компания с таким id не найдена']
                traceId: 00-2f1c...-01
        '409':
          description: Пользователь с таким телефоном уже существует
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Conflict
                status: 409
                detail: Пользователь с таким телефоном уже существует
                traceId: 00-2f1c...-01

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: Login
      summary: Вход в систему
      description: |
        Начинает сессию (см. раздел «Авторизация»): access token (JWT на 15 минут; содержит id пользователя, роль
        и id его компании) — в теле, refresh token — в cookie `refresh_token` (заголовок `Set-Cookie`).
        Каждый вход — новая сессия, прежние сессии пользователя (другие устройства) не затрагиваются.
        Вход разрешён только при is_approved = true и is_active = true.
        Телефон перед поиском нормализуется так же, как при регистрации. Без авторизации.
        При 401 и 403 cookie не выставляется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      responses:
        '200':
          description: Успешная авторизация
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Неверный телефон или пароль
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Unauthorized
                status: 401
                detail: Неверный телефон или пароль
                traceId: 00-2f1c...-01
        '403':
          description: Аккаунт не подтверждён (is_approved = false) или уволен (is_active = false)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.4
                title: Forbidden
                status: 403
                detail: Аккаунт ещё не подтверждён владельцем
                traceId: 00-2f1c...-01

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: Refresh
      summary: Обновление пары токенов
      description: |
        Принимает refresh token из cookie `refresh_token` (тела запроса нет) и выдаёт новый access token в теле
        и новый refresh token в cookie. **Ротация:** предъявленный токен гасится; новый продолжает ту же сессию
        и действует 30 дней с момента выдачи. Роль и компания в новом JWT — текущие, из БД.
        Без JWT: access token к этому моменту обычно уже истёк.

        401 — если cookie нет, токен неизвестен, истёк или погашен (выход, увольнение, ротация), а также если
        аккаунт уволен (is_active = false). Причины клиенту не различаются: в любом случае нужно войти заново.
        При 401 cookie удаляется.

        Предъявлен токен, уже погашенный ротацией, — признак кражи (им воспользовались дважды: владелец и вор).
        Гасится вся сессия, включая токен, выданный взамен; ответ 401. Сессии на других устройствах не затрагиваются.

        Клиент не вызывает refresh параллельно, в том числе из нескольких вкладок: второй запрос с тем же
        токеном выглядит как повторное предъявление и завершает сессию.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: Новая пара токенов
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Сессии нет или она завершена — нужно войти заново. Cookie удаляется
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Unauthorized
                status: 401
                detail: Сессия завершена, войдите заново
                traceId: 00-2f1c...-01

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: Logout
      summary: Выход (завершение сессии)
      description: |
        Гасит refresh token из cookie `refresh_token` вместе со всей его сессией и удаляет cookie.
        Без cookie, с неизвестным, истёкшим или уже погашенным токеном — тоже 204: результат один, сессии нет.
        Access token не отзывается и действует до истечения срока (до 15 минут) — клиент просто забывает его.
        Сессии на других устройствах не затрагиваются. Без JWT.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '204':
          description: Сессия завершена, cookie удалена
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'

  /api/auth/server-key:
    get:
      tags: [Auth]
      operationId: GetServerKey
      summary: Получение публичного ключа сервера
      description: |
        Используется завхозом для верификации сертификатов сотрудников в оффлайне. Публичный ключ, без авторизации.
        Возвращает также serverTime — по нему клиент вычисляет смещение своих часов относительно сервера.
      security: []
      responses:
        '200':
          description: Публичный ключ Ed25519 сервера и текущее время сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerKeyResponse'

  /api/auth/worker-cert:
    get:
      tags: [Auth]
      operationId: GetWorkerCert
      summary: Выдача сертификата и временного ключа сотруднику
      description: |
        Сервер генерирует временную пару ключей Ed25519, формирует токен ServerSignedToken
        (workerId, fio, issuedAt, expiresAt = issuedAt + 12 часов, workerPublicKey), подписывает его своим
        приватным ключом и отдаёт сотруднику вместе с временным приватным ключом. Приватный ключ сервером
        не сохраняется. Выдаётся только при is_approved = true и is_active = true (проверяется по БД в момент запроса).
        Выданный сертификат не отзывается (завхоз проверяет его без сервера): после увольнения сотрудника
        его операции при синхронизации получают флаг WORKER_DEACTIVATED.

        **Требуется роль:** Worker.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Сертификат (token + serverSignature), временный приватный ключ и время сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerCertificate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Роль не Worker — без тела (проверка JWT, как у Forbidden);
            аккаунт не подтверждён или уволен (is_approved = false или is_active = false, проверка по БД в момент
            запроса) — тело ProblemDetails.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.4
                title: Forbidden
                status: 403
                detail: Сотрудник уволен, сертификат не выдаётся
                traceId: 00-2f1c...-01

  # ==========================================
  # КОМПАНИИ
  # ==========================================
  /api/companies/my:
    get:
      tags: [Companies]
      operationId: GetMyCompany
      summary: Своя компания
      description: |
        Id и название компании вызывающего. Owner сообщает этот id сотрудникам и завхозам, они указывают его
        при регистрации. Чужую компанию получить нельзя, как и список всех компаний. Отдельного создания
        компании нет: она создаётся при регистрации Owner.

        **Требуется авторизация:** любая роль.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Компания вызывающего
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # УПРАВЛЕНИЕ ПОЛЬЗОВАТЕЛЯМИ
  # ==========================================
  /api/users:
    get:
      tags: [Users]
      operationId: GetUsers
      summary: Список пользователей своей компании
      description: "**Требуется роль:** Owner. Только пользователи компании вызывающего."
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список пользователей своей компании (включая неподтверждённых и уволенных)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/me:
    get:
      tags: [Users]
      operationId: GetMe
      summary: Свой профиль
      description: |
        Пользователь вызывающего: id и компания — из JWT (`sub`, `company_id`), параметров нет. Для профиля на клиенте
        (ФИО, телефон, роль). Название компании — `GET /api/companies/my`.
        Уволенный, пока его access token не истёк (до 15 минут), получает свой профиль с isActive = false.
        404 — пользователя из токена нет в его компании.

        **Требуется авторизация:** любая роль.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль вызывающего
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}:
    delete:
      tags: [Users]
      operationId: DeactivateUser
      summary: Уволить/Деактивировать пользователя
      description: |
        Переводит is_active = false и запоминает момент увольнения (время сервера); запись не удаляется
        (на неё ссылается журнал). В той же транзакции гасит все refresh token пользователя — все его сессии
        на всех устройствах: следующий `/api/auth/refresh` вернёт 401.
        Повторный вызов — 200, момент увольнения не меняется.

        Что продолжает действовать:
        - выданный access token — до истечения срока, не более 15 минут;
        - офлайн-сертификат сотрудника — до истечения срока (не более 12 часов), но операции с временем
          не раньше момента увольнения при синхронизации получают флаг WORKER_DEACTIVATED.

        Owner не может уволить сам себя. Только пользователь своей компании: пользователь другой компании — 404.

        **Требуется роль:** Owner.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Пользователь уволен (is_active = false), без тела
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Попытка уволить самого себя
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Conflict
                status: 409
                detail: Нельзя уволить самого себя
                traceId: 00-2f1c...-01

  /api/users/{id}/approve:
    post:
      tags: [Users]
      operationId: ApproveUser
      summary: Подтверждение регистрации пользователя
      description: |
        Переводит is_approved = true. Повторный вызов — 200.
        Только пользователь своей компании: пользователь другой компании — 404.

        **Требуется роль:** Owner.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Пользователь подтверждён, без тела
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # УПРАВЛЕНИЕ ИНСТРУМЕНТАМИ
  # ==========================================
  /api/tools:
    get:
      tags: [Tools]
      operationId: GetTools
      summary: Получение реестра инструментов
      description: |
        Возвращает список активных (не списанных) инструментов своей компании вместе с текущим держателем —
        локальный реестр завхоза и печать QR-кодов.

        **Требуется роль:** Issuer, Owner.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список инструментов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tool'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Tools]
      operationId: CreateTool
      summary: Добавление нового инструмента
      description: |
        Инструмент добавляется в реестр компании вызывающего. id присваивается базой данных и возвращается
        в ответе — по нему завхоз печатает QR-код инструмента.
        Новый инструмент создаётся в состоянии Good, без комментария и без держателя.
        Название — не длиннее 100 символов (попадает в QR сотрудника).

        **Требуется роль:** Issuer, Owner.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToolRequest'
      responses:
        '201':
          description: Инструмент создан, ему присвоен id
          headers:
            Location:
              description: Адрес созданного инструмента, `/api/tools/{id}`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/tools/{id}:
    get:
      tags: [Tools]
      operationId: GetTool
      summary: Данные инструмента
      description: |
        Возвращает инструмент своей компании, в том числе списанный. Инструмент другой компании — 404.

        **Требуется роль:** Issuer, Owner.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Информация об инструменте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tool'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Tools]
      operationId: UpdateToolCondition
      summary: Частичное обновление состояния инструмента
      description: |
        Ручное вмешательство вне цикла выдачи/возврата (заметили повреждение, инструмент отремонтирован).
        Обычный путь обновления `condition` — VALID-запись в `/api/sync`.

        Поле, которое не передано (или null), не меняется; `comment: ""` очищает комментарий.
        Изменение `condition` выставляет время изменения состояния в текущее время сервера — после этого
        более ранние операции из поздних синхронизаций состояние не перезаписывают.
        Разрешено и для списанного инструмента (is_active не меняется).
        Инструмент другой компании — 404.

        **Требуется роль:** Issuer, Owner.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateToolConditionRequest'
      responses:
        '200':
          description: Состояние успешно обновлено, без тела
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Tools]
      operationId: DeleteTool
      summary: Списание инструмента
      description: |
        Переводит is_active = false. Необратимое действие. Повторный вызов — 200.
        Списанный инструмент не попадает в GET /api/tools, но остаётся в GET /api/tools/{id} и в журнале.
        Инструмент другой компании — 404.

        **Требуется роль:** Owner.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Инструмент списан, без тела
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # СИНХРОНИЗАЦИЯ И ЖУРНАЛ (LOGS)
  # ==========================================
  /api/sync:
    post:
      tags: [Sync]
      operationId: Sync
      summary: Синхронизация оффлайн-выдач и возвратов
      description: |
        Завхоз отправляет массив записей своего локального журнала: строка QR сотрудника как есть
        и время сканирования. Сервер сам строго разбирает каждую строку по формату AT1 (см. OfflineRentalPayload),
        проверяет обе подписи, время, инструмент и повтор, и сохраняет **каждую** запись в журнал независимо
        от результата этих проверок — результат пишется в validationFlag (по первой непройденной проверке,
        порядок — см. схему ValidationFlag).

        Строка `qr` не по формату AT1 — ошибка конверта, как и неверное тело запроса: честный клиент завхоза
        такую строку не примет при оффлайн-проверке. Запрос целиком отклоняется (400), ничего не сохраняется.

        issuer_id записи берётся из JWT вызывающего.

        **Идемпотентность:** запись с тем же issuer_id, scannedAt и той же строкой qr, уже сохранённая
        ранее (повторная отправка после обрыва связи), повторно не создаётся — в ответе возвращается существующая.

        Запись принадлежит компании завхоза (company_id из JWT). Сотрудник из токена и инструмент из операции
        ищутся только в этой компании (включая уволенных сотрудников — их операции получают WORKER_DEACTIVATED,
        если совершены не раньше момента увольнения): сотрудник другой компании неотличим от несуществующего (UNKNOWN_WORKER),
        инструмент другой компании — тоже (UNKNOWN_TOOL). Привязки worker_id и tool_id у записи заполняются
        только проверенным и найденным в компании завхоза, иначе null; чужие id в журнал не попадают.

        При флаге VALID сервер обновляет `tools.condition` значением `toolCondition`, если время операции
        (timestamp) не раньше последнего изменения состояния инструмента (>=).

        Пустой массив допустим — ответ `[]`.

        **Требуется роль:** Issuer.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SyncRecord'
      responses:
        '200':
          description: Все записи сохранены; результаты в порядке записей запроса
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncResult'
              example:
                - logId: 41
                  validationFlag: VALID
                - logId: 42
                  validationFlag: TIME_DRIFT
        '400':
          description: |
            Тело запроса не является массивом объектов SyncRecord, либо хотя бы одна строка `qr` не соответствует
            формату AT1. Ничего не сохраняется. Для записей с неверным форматом ключ ошибки — номер записи
            в массиве (с 0): `"[3].qr"`. По этим номерам клиент завхоза откладывает такие записи (локально,
            для разбора) и отправляет остальные повторно, чтобы одна запись не блокировала синхронизацию всей очереди.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                errors:
                  '[3].qr': ['Строка не соответствует формату AT1: workerSignature должна быть 64 байта']
                  '[7].qr': ['Строка не соответствует формату AT1: ожидается 5 частей через точку']
                traceId: 00-2f1c...-01
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/logs:
    get:
      tags: [Sync]
      operationId: GetLogs
      summary: Просмотр журнала движения инструментов
      description: |
        Возвращает записи rental_logs своей компании (записи, синхронизированные её завхозами), новые сверху:
        по убыванию времени операции (qrTimestamp), затем по убыванию id.
        Записи со всеми флагами, не только VALID.

        **Требуется роль:** Issuer, Owner.
      security:
        - BearerAuth: []
      parameters:
        - name: action
          in: query
          required: false
          description: Фильтр по типу операции
          schema:
            $ref: '#/components/schemas/RentalAction'
        - name: toolId
          in: query
          required: false
          description: Фильтр по инструменту (записи с toolId = null в выборку не попадают); не UUID — 400
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: История операций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalLogEntry'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # УВЕДОМЛЕНИЯ
  # ==========================================
  /api/notifications:
    get:
      tags: [Notifications]
      operationId: GetNotifications
      summary: Уведомления своей компании
      description: |
        Не более 100 последних уведомлений своей компании, новые сверху: по убыванию occurredAt, затем по убыванию id.
        Прочитанные тоже возвращаются (`isRead: true`). Число непрочитанных клиент считает сам.

        **Требуется роль:** Owner.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список уведомлений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: MarkNotificationRead
      summary: Отметить уведомление прочитанным
      description: |
        Переводит уведомление в прочитанные. Повторный вызов — 200. Только уведомление своей компании:
        уведомление другой компании — 404.

        **Требуется роль:** Owner.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: id уведомления (Notification.id); не целое число — 400
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Уведомление прочитано, без тела
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (JWT) из POST /api/auth/login или POST /api/auth/refresh, срок действия 15 минут

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: id объекта (UUID); значение, не являющееся UUID, — 400
      schema:
        type: string
        format: uuid
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      description: |
        Refresh token. Браузер отправляет cookie сам; JavaScript её не видит (HttpOnly).
        Отсутствие cookie — не 400: обрабатывается как неизвестный токен
      schema:
        type: string
        example: q8RzJ2vW0bXyL5nT3mKcA1sDfGhJkLzXcVbNm9QwErT

  headers:
    SetRefreshCookie:
      description: |
        Новый refresh token: `refresh_token=<токен>; Max-Age=2592000; Path=/api/auth; Secure; HttpOnly; SameSite=Strict`
        (порядок атрибутов не важен). Max-Age — 30 дней в секундах
      schema:
        type: string
      example: refresh_token=q8RzJ2vW0bXyL5nT3mKcA1sDfGhJkLzXcVbNm9QwErT; Max-Age=2592000; Path=/api/auth; Secure; HttpOnly; SameSite=Strict
    ClearRefreshCookie:
      description: |
        Удаление cookie: `refresh_token` с пустым значением, тем же Path=/api/auth и истёкшим сроком
        (`Expires` в прошлом или `Max-Age=0`)
      schema:
        type: string
      example: refresh_token=; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/api/auth; Secure; HttpOnly; SameSite=Strict

  responses:
    ValidationError:
      description: |
        Некорректный запрос: тело не разбирается как JSON нужной формы, нарушены обязательность или ограничения полей,
        неверный параметр пути или запроса. Ключи `errors` — пути к полям в именах JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.1
            title: One or more validation errors occurred.
            status: 400
            errors:
              fullName: ['The field FullName must be a string or array type with a maximum length of ''100''.']
              role: ['The Role field is required.']
            traceId: 00-2f1c...-01
    Unauthorized:
      description: Не передан, просрочен или недействителен JWT. Без тела; заголовок `WWW-Authenticate` со схемой Bearer
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer error="invalid_token", error_description="The token expired at '...'"
    Forbidden:
      description: |
        Роль пользователя не допускается к этому эндпоинту. Без тела.
        Уволенный пользователь с ещё не истёкшим access token получает обычные ответы до истечения его срока
        (не более 15 минут, см. раздел «Авторизация»).
    NotFound:
      description: Объект с таким id не найден (в том числе принадлежащий другой компании)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.5
            title: Not Found
            status: 404
            detail: Инструмент с id 17c4e5a2-93b8-4f10-8d6a-0b2e7c9d4f35 не найден
            traceId: 00-2f1c...-01

  schemas:
    # ---------- Ошибки (RFC 9457 / 7807) ----------

    ProblemDetails:
      type: object
      description: |
        Описание ошибки в формате RFC 9457 (ранее RFC 7807), `application/problem+json`.
        Формирует ASP.NET Core; допускает дополнительные поля.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI типа ошибки (для стандартных кодов — ссылка на раздел RFC 9110)
          example: https://tools.ietf.org/html/rfc9110#section-15.5.5
        title:
          type: string
          description: Краткое название типа ошибки (стандартное, на английском)
          example: Not Found
        status:
          type: integer
          format: int32
          description: HTTP-код ответа
          example: 404
        detail:
          type: string
          nullable: true
          description: Пояснение к конкретному случаю на русском, для показа пользователю
          example: Инструмент с id 17c4e5a2-93b8-4f10-8d6a-0b2e7c9d4f35 не найден
        instance:
          type: string
          nullable: true
          description: URI конкретного случая ошибки (обычно не заполняется)
        traceId:
          type: string
          description: Идентификатор запроса для поиска в логах сервера
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
      additionalProperties: true

    ValidationProblemDetails:
      description: ProblemDetails с перечнем ошибок по полям (ответ 400)
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: |
                Ключ — путь к полю в именах JSON (`fullName`, `[3].qr`, `id`) или JSON-путь при ошибке разбора
                (`$.role`); значение — список сообщений об ошибках.
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                '[3].qr': ['Строка не соответствует формату AT1: ожидается 5 частей через точку']

    # ---------- Перечисления ----------

    UserRole:
      type: string
      description: Worker — сотрудник, Issuer — завхоз, Owner — владелец (регистрируются все три)
      enum: [Worker, Issuer, Owner]

    ToolCondition:
      type: string
      description: Состояние инструмента, по возрастанию тяжести (Good < Damaged < Broken)
      enum: [Good, Damaged, Broken]

    RentalAction:
      type: string
      description: TAKE — сотрудник берёт инструмент, GIVE — возвращает
      enum: [TAKE, GIVE]

    ValidationFlag:
      type: string
      description: |
        Результат серверной проверки записи журнала. Строка QR к этому моменту уже разобрана по формату AT1
        (иначе весь запрос /api/sync отклоняется с 400). Проверки выполняются в указанном порядке,
        флаг — по первой непройденной:
        - INVALID_SERVER_SIG — подпись сервера на токене невалидна;
        - INVALID_WORKER_SIG — подпись работника невалидна;
        - EXPIRED_TOKEN — timestamp вне интервала [issuedAt, expiresAt];
        - TIME_DRIFT — |timestamp − scannedAt| > 60 с, либо timestamp или scannedAt позже момента приёма сервером более чем на 5 минут;
        - UNKNOWN_WORKER — workerId из токена нет среди пользователей компании завхоза (сотрудник другой компании
          неотличим от несуществующего);
        - WORKER_DEACTIVATED — сотрудник уволен, и timestamp не раньше момента увольнения (>=): офлайн-сертификат
          не отзывается, поэтому операции после увольнения отсекаются здесь. Подделать время назад сотрудник
          не может: scannedAt ставит завхоз, и расхождение даст TIME_DRIFT раньше;
        - UNKNOWN_TOOL — toolId из операции отсутствует в реестре компании завхоза (инструмент другой компании — тоже);
        - DUPLICATE — VALID-запись с такой же workerSignature уже есть в журнале (повторное использование QR);
          записи с другими флагами не в счёт, поэтому на один QR приходится не более одной VALID-записи;
        - VALID — все проверки пройдены.
      enum: [VALID, INVALID_SERVER_SIG, INVALID_WORKER_SIG, EXPIRED_TOKEN, TIME_DRIFT, UNKNOWN_WORKER, WORKER_DEACTIVATED, UNKNOWN_TOOL, DUPLICATE]

    NotificationType:
      type: string
      description: |
        - EmployeeAwaitingApproval — зарегистрировался сотрудник или завхоз, ждёт подтверждения (`userId` — он).
          Когда Owner подтверждает или увольняет этого пользователя, уведомление само становится прочитанным;
        - SessionReuseDetected — повторно предъявлен уже погашенный refresh token: возможна кража сессии
          (`userId` — владелец сессии). Сессия уже завершена сервером; стоит выяснить у сотрудника, что случилось;
        - SuspiciousSync — завхоз синхронизировал записи с флагами, отличными от VALID (`userId` — завхоз,
          `flags` — сколько таких записей по каждому флагу). Повторная отправка тех же записей нового уведомления не создаёт.
      enum: [EmployeeAwaitingApproval, SessionReuseDetected, SuspiciousSync]

    # ---------- Запросы и ответы ----------

    RegisterRequest:
      type: object
      description: |
        Поля компании зависят от роли: Owner передаёт `companyName` (и не передаёт `companyId`),
        Worker и Issuer — `companyId` (и не передают `companyName`). Иначе — 400.
      required: [fullName, phone, password, role]
      properties:
        fullName:
          type: string
          maxLength: 100
          description: ФИО. Попадает в QR сотрудника (fio в token), поэтому ограничено 100 символами
          example: "Иванов Иван Иванович"
        phone:
          type: string
          pattern: '^[\s()-]*(\+7|7|8)(?:[\s()-]*[0-9]){10}[\s()-]*$'
          description: |
            Телефон — логин. Любой допустимый формат (см. раздел «Телефон»); сохраняется как `+7XXXXXXXXXX`.
            Уникален среди всех пользователей, включая уволенных
          example: "+7 (999) 123-45-67"
        password:
          type: string
          format: password
          example: "securePassword123"
        role:
          $ref: '#/components/schemas/UserRole'
        companyId:
          type: string
          format: uuid
          description: |
            Только Worker и Issuer, обязателен для них. id существующей компании: его сообщает Owner
            (виден ему в GET /api/companies/my)
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        companyName:
          type: string
          maxLength: 100
          description: |
            Только Owner, обязателен для него. Название новой компании (не уникально).
            Owner становится первым пользователем компании и подтверждается сразу
          example: "ООО Ромашка"

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: '^[\s()-]*(\+7|7|8)(?:[\s()-]*[0-9]){10}[\s()-]*$'
          description: Любой допустимый формат (см. раздел «Телефон»); перед поиском нормализуется
          example: "89991234567"
        password:
          type: string
          format: password
          example: "securePassword123"

    LoginResponse:
      type: object
      description: |
        Ответ входа и обновления сессии. Refresh token в тело не попадает — он в cookie (заголовок `Set-Cookie`)
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: "JWT, срок действия 15 минут; передаётся в заголовке `Authorization: Bearer <accessToken>`"
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1Iiwicm9sZSI6Iklzc3VlciJ9.c2lnbmF0dXJl
        expiresIn:
          type: integer
          format: int32
          description: |
            Через сколько секунд истечёт access token (900). Относительное значение не зависит от часов клиента:
            по нему клиент может заранее вызвать `/api/auth/refresh`
          example: 900

    ServerKeyResponse:
      type: object
      required: [serverPublicKey, serverTime]
      properties:
        serverPublicKey:
          type: string
          description: Публичный ключ Ed25519 сервера, 32 байта, base64url без паддинга (43 символа)
          example: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        serverTime:
          type: integer
          format: int64
          description: Текущее время сервера (Unix time) — для вычисления смещения часов клиента
          example: 1790000000

    CreateToolRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Название. Попадает в QR сотрудника (toolName в op), поэтому ограничено 100 символами
          example: "Дрель Bosch GSB 16 RE"

    UpdateToolConditionRequest:
      type: object
      description: Не переданное (или null) поле не меняется; comment = "" очищает комментарий.
      properties:
        condition:
          # В OpenAPI 3.0 nullable действует только рядом с type, поэтому значения ToolCondition перечислены здесь
          type: string
          enum: [Good, Damaged, Broken]
          nullable: true
          description: Новое состояние; меняет и время изменения состояния (текущее время сервера)
        comment:
          type: string
          nullable: true
          description: Новый комментарий; "" — очистить
      example:
        condition: Damaged
        comment: Трещина на корпусе

    WorkerCertificate:
      type: object
      description: |
        Временный сертификат и ключ, которые работник получает, пока есть интернет.
        Сертификат — это пара token + serverSignature. Содержимое token — ServerSignedToken
        (клиент декодирует base64url → JSON). Для подписи операций token и serverSignature
        используются как строки, в точности как получены.
      required: [token, serverSignature, temporaryPrivateKey, serverTime]
      properties:
        token:
          type: string
          description: base64url(UTF-8 JSON ServerSignedToken)
        serverSignature:
          type: string
          description: base64url(Ed25519(ключ сервера, ASCII "AT1-TOKEN." + token)), 64 байта (86 символов)
        temporaryPrivateKey:
          type: string
          description: |
            Временный приватный ключ Ed25519 (32-байтный seed), base64url без паддинга (43 символа).
            В WebCrypto импортируется как JWK { kty: "OKP", crv: "Ed25519", d: temporaryPrivateKey, x: workerPublicKey из token }.
        serverTime:
          type: integer
          format: int64
          description: Текущее время сервера (Unix time) — для вычисления смещения часов клиента
          example: 1790000000

    SyncRecord:
      type: object
      description: Запись локального журнала завхоза
      required: [qr, scannedAt]
      properties:
        qr:
          $ref: '#/components/schemas/OfflineRentalPayload'
        scannedAt:
          type: integer
          format: int64
          description: Время сканирования по часам завхоза с поправкой на смещение относительно сервера (Unix time). Не подписывается — за него отвечает завхоз (issuer_id).
          example: 1790003605

    SyncResult:
      type: object
      required: [logId, validationFlag]
      properties:
        logId:
          type: integer
          format: int32
          description: id записи в журнале (для повторно отправленной записи — id уже существующей)
          example: 41
        validationFlag:
          $ref: '#/components/schemas/ValidationFlag'

    # ---------- Основные модели ----------

    Company:
      type: object
      description: Компания. Кроме названия других полей нет
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          description: Неугадываемый id; по нему сотрудники и завхозы присоединяются к компании при регистрации
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        name:
          type: string
          maxLength: 100
          description: Название (не уникально)
          example: "ООО Ромашка"

    UserResponse:
      type: object
      required: [id, fullName, phone, role, isApproved, isActive]
      properties:
        id:
          type: string
          format: uuid
          example: 5b1d0c8a-2f4e-4a63-9d17-8e0c3a6f4b21
        fullName:
          type: string
          example: "Иванов Иван Иванович"
        phone:
          type: string
          pattern: '^\+7[0-9]{10}$'
          description: Нормализованный номер
          example: "+79991234567"
        role:
          $ref: '#/components/schemas/UserRole'
        isApproved:
          type: boolean
          description: Регистрация подтверждена Owner компании (Owner, создавший компанию, подтверждён сразу)
        isActive:
          type: boolean
          description: false — уволен (запись не удаляется)

    Tool:
      type: object
      description: |
        Держатель (holderId, holderName, heldSince) вычисляется сервером по последней по времени операции
        VALID-записи журнала (view tool_current_holders): если это TAKE — инструмент на руках у сотрудника,
        если GIVE или записей нет — на месте у завхоза, и все три поля равны null.
        Учитываются только синхронизированные записи. Инструмент принадлежит компании вызывающего (поля компании в модели нет).
      required: [id, name, condition, comment, isActive, holderId, holderName, heldSince]
      properties:
        id:
          type: string
          format: uuid
          description: Присваивается базой данных; по нему печатается QR инструмента
          example: 17c4e5a2-93b8-4f10-8d6a-0b2e7c9d4f35
        name:
          type: string
          example: "Дрель Bosch GSB 16 RE"
        condition:
          $ref: '#/components/schemas/ToolCondition'
        comment:
          type: string
          nullable: true
          description: Комментарий (ставится только через PATCH)
          example: null
        isActive:
          type: boolean
          description: false — списан (необратимо)
        holderId:
          type: string
          format: uuid
          nullable: true
          description: id сотрудника, у которого инструмент на руках; null — инструмент на месте у завхоза
          example: 5b1d0c8a-2f4e-4a63-9d17-8e0c3a6f4b21
        holderName:
          type: string
          nullable: true
          description: ФИО сотрудника-держателя (из users)
          example: "Иванов Иван Иванович"
        heldSince:
          type: integer
          format: int64
          nullable: true
          description: Время операции TAKE, с которой инструмент у держателя (Unix time)
          example: 1790003600

    # ---------- Содержимое QR сотрудника ----------

    OfflineRentalPayload:
      type: string
      description: |
        Строка QR-кода сотрудника (и для взятия, и для возврата), ASCII, пять частей через точку:
        `AT1.<token>.<serverSignature>.<op>.<workerSignature>`
        - token, serverSignature — сертификат из WorkerCertificate, без изменений;
        - op = base64url(UTF-8 JSON RentalOperation);
        - workerSignature = base64url(Ed25519(временный приватный ключ, ASCII "AT1-OP." + token + "." + serverSignature + "." + op)).

        Подписываются готовые строки, а не объекты: подпись проверяется над строками token и op в том виде,
        в каком они пришли, JSON заново не сериализуется, поэтому порядок полей и пробелы значения не имеют.

        **Строгий разбор** (одинаково у завхоза оффлайн и на сервере; нарушение любого правила — строка
        не по формату, сервер отвечает на /api/sync 400):
        - ровно пять частей через точку, первая — `AT1`;
        - части 2–5 — base64url без паддинга: только символы `A–Z a–z 0–9 - _`, без `=`;
        - serverSignature и workerSignature — 64 байта, workerPublicKey — 32 байта;
        - token и op — UTF-8 JSON-объекты; все поля схем ServerSignedToken и RentalOperation обязательны,
          лишние поля игнорируются;
        - строки — JSON-строки (не null); целые — JSON-числа (не строки, без дробной части);
        - workerId и toolId — JSON-строки с UUID в каноническом виде: ровно 36 символов, строчные hex, `8-4-4-4-12`
          (без фигурных скобок, без заглавных букв);
        - action и toolCondition — строго значения enum с учётом регистра (`TAKE`, но не `take` и не `0`).

        Типичная длина — 600–800 символов (два UUID добавляют около 90 символов).
      example: "AT1.eyJ3b3JrZXJJZCI6NX0.c2lnbmF0dXJl.eyJhY3Rpb24iOiJUQUtFIn0.c2lnbmF0dXJl"

    ServerSignedToken:
      type: object
      description: |
        Содержимое token (после base64url-декодирования — UTF-8 JSON). Сервер удостоверяет подписью,
        что публичный ключ workerPublicKey принадлежит сотруднику workerId до момента expiresAt.
        Не является непрозрачным блобом: клиент завхоза читает поля для оффлайн-проверки.
      required: [workerId, fio, issuedAt, expiresAt, workerPublicKey]
      properties:
        workerId:
          type: string
          format: uuid
          description: UUID пользователя в таблице users — связывает операцию с конкретным сотрудником (ФИО не уникально).
          example: 5b1d0c8a-2f4e-4a63-9d17-8e0c3a6f4b21
        fio:
          type: string
          description: ФИО сотрудника на момент выдачи сертификата
          example: "Иванов Иван Иванович"
        issuedAt:
          type: integer
          format: int64
          description: Unix time выдачи сертификата
          example: 1790000000
        expiresAt:
          type: integer
          format: int64
          description: Unix time истечения срока действия (issuedAt + 12 часов)
          example: 1790043200
        workerPublicKey:
          type: string
          description: Временный публичный ключ Ed25519 сотрудника, 32 байта, base64url без паддинга
          example: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo

    RentalOperation:
      type: object
      description: Содержимое op (после base64url-декодирования — UTF-8 JSON) — операция, заявленная сотрудником.
      required: [action, toolCondition, toolId, toolName, timestamp]
      properties:
        action:
          $ref: '#/components/schemas/RentalAction'
        toolCondition:
          $ref: '#/components/schemas/ToolCondition'
        toolId:
          type: string
          format: uuid
          description: UUID инструмента из его QR-наклейки
          example: 17c4e5a2-93b8-4f10-8d6a-0b2e7c9d4f35
        toolName:
          type: string
          description: Название из QR-наклейки инструмента (сервер с реестром не сверяет)
          example: "Дрель Bosch GSB 16 RE"
        timestamp:
          type: integer
          format: int64
          description: Unix time создания QR-кода (по часам сотрудника с поправкой на смещение относительно сервера)
          example: 1790003600

    RentalLogEntry:
      type: object
      description: |
        Запись в неизменяемом журнале операций; принадлежит компании завхоза (issuerId). Привязка заполняется
        только проверенным и найденным в компании завхоза, иначе null:
        - workerId — id из токена, если подпись сервера верна (поддельный токен не приписывает операцию сотруднику)
          и сотрудник есть в компании завхоза; null при INVALID_SERVER_SIG и UNKNOWN_WORKER;
        - toolId — toolId из операции, если подпись работника верна и инструмент есть в реестре компании завхоза;
          null при INVALID_SERVER_SIG, INVALID_WORKER_SIG, UNKNOWN_TOOL;
        - workerName/toolName берутся из users/tools, если workerId/toolId заполнены, иначе — из заявленных
          непроверенных значений внутри строки QR (fio, toolName).
      required: [id, toolId, toolName, workerId, workerName, issuerId, action, toolCondition, qrTimestamp, scannedAt, validationFlag, createdAt]
      properties:
        id:
          type: integer
          format: int32
          example: 41
        toolId:
          type: string
          format: uuid
          nullable: true
          example: 17c4e5a2-93b8-4f10-8d6a-0b2e7c9d4f35
        toolName:
          type: string
          example: "Дрель Bosch GSB 16 RE"
        workerId:
          type: string
          format: uuid
          nullable: true
          example: 5b1d0c8a-2f4e-4a63-9d17-8e0c3a6f4b21
        workerName:
          type: string
          example: "Иванов Иван Иванович"
        issuerId:
          type: string
          format: uuid
          description: id завхоза, синхронизировавшего запись (из его JWT); его компания — компания записи
          example: 2a6f9d34-81c5-4b07-a3e2-6d5c7f1e9b08
        action:
          $ref: '#/components/schemas/RentalAction'
        toolCondition:
          $ref: '#/components/schemas/ToolCondition'
        qrTimestamp:
          type: integer
          format: int64
          description: timestamp из операции (время операции)
          example: 1790003600
        scannedAt:
          type: integer
          format: int64
          description: Время сканирования завхозом
          example: 1790003605
        validationFlag:
          $ref: '#/components/schemas/ValidationFlag'
        createdAt:
          type: integer
          format: int64
          description: Время сохранения записи на сервере (синхронизации), Unix time
          example: 1790010000

    Notification:
      type: object
      description: Уведомление Owner. Создаётся асинхронно после действия (см. раздел «Уведомления»)
      required: [id, type, occurredAt, userId, userName, flags, isRead]
      properties:
        id:
          type: integer
          format: int64
          example: 17
        type:
          $ref: '#/components/schemas/NotificationType'
        occurredAt:
          type: integer
          format: int64
          description: Время события, породившего уведомление, Unix time
          example: 1790010000
        userId:
          type: string
          format: uuid
          description: О ком уведомление (см. NotificationType)
          example: 5b1d0c8a-2f4e-4a63-9d17-8e0c3a6f4b21
        userName:
          type: string
          nullable: true
          description: ФИО этого пользователя; null — его нет в компании
          example: "Иванов Иван Иванович"
        flags:
          type: object
          nullable: true
          description: |
            Только SuspiciousSync, у остальных типов — null. Ключ — ValidationFlag (кроме VALID),
            значение — число новых записей с этим флагом
          additionalProperties:
            type: integer
            format: int32
          example:
            INVALID_WORKER_SIG: 1
            TIME_DRIFT: 2
        isRead:
          type: boolean
          example: false
