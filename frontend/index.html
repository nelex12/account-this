<!doctype html>
<!-- lang="ru": иначе браузер считает страницу английской и предлагает перевод. translate="no" и meta google
     запрещают автоперевод: переводчик подменяет текстовые узлы, React их не находит и падает (insertBefore/removeChild) -->
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FFA500" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AT!" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Account This!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
