server {
    listen 80;
    server_name localhost;

    # Раздача статики фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Если маршрут не найден (например, при React Router), возвращаем index.html
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на бэкенд (сервис backend из docker-compose.yml, порт 8080 внутри сети compose)
    location /api/ {
        # Накопленный оффлайн-журнал завхоза уходит в /api/sync одним запросом (около 1 КБ на запись).
        # По умолчанию nginx принимает до 1 МБ и на большой очереди ответил бы 413; 30 МБ — как у backend (Kestrel)
        client_max_body_size 30m;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
