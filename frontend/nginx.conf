server {
    listen 80;
    server_name localhost;

    # Раздача статики фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Если маршрут не найден (например, при React Router), возвращаем index.html
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на бэкенд
    location /api/ {
        # Обрати внимание: в .NET 8 внутри контейнера по умолчанию используется порт 8080
        # Если у тебя .NET 6/7, то порт скорее всего 80
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}