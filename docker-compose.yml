services:
  postgres:
    image: postgres:16
    container_name: accountthis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accountthis-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # Строку подключения backend собирает сам из POSTGRES_* (как и при запуске из IDE).
      # Внутри сети compose база доступна по имени сервиса postgres и порту 5432
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      ASPNETCORE_URLS: http://+:8080
      # Ключи сервера (см. generate-keys.bat)
      SERVER_SIGNING_KEY: ${SERVER_SIGNING_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    ports:
      - "${BACKEND_PORT:-5000}:8080"

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accountthis-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80" # Сайт будет доступен просто по http://localhost

volumes:
  postgres_data: