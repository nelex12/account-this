services:
  postgres:
    image: postgres:16
    container_name: accountthis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Схему создаёт backend при старте (миграции), поэтому он ждёт, пока база начнёт принимать подключения
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Брокер сообщений: backend публикует события аудита и сам же их потребляет (docs/events.md)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: accountthis-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"   # AMQP
      - "15672:15672"                   # веб-интерфейс: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accountthis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      # Строку подключения backend собирает сам из POSTGRES_* (как и при запуске из IDE).
      # Внутри сети compose база доступна по имени сервиса postgres и порту 5432
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Внутри сети compose брокер доступен по имени сервиса rabbitmq и порту 5672
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      ASPNETCORE_URLS: http://+:8080
      # Ключи сервера (см. generate-keys.bat)
      SERVER_SIGNING_KEY: ${SERVER_SIGNING_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
    ports:
      - "${BACKEND_PORT:-5000}:8080"

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accountthis-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80" # Сайт будет доступен просто по http://localhost

volumes:
  postgres_data:
  rabbitmq_data: